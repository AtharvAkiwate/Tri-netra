[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinetra"
version = "0.1.0"
description = "Trustworthy AI Security & Assurance Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "TRI-NETRA Development Team"}
]

[tool.setuptools.packages.find]
where = ["src"]