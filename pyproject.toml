[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinetra"
version = "0.1.0"
description = "Trustworthy AI Security & Assurance Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "TRI-NETRA Development Team"}
]

[project.optional-dependencies]
features = [
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
]
dinov2 = [
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
    "torch>=2.1",
    "transformers>=4.40,<5",
    "safetensors>=0.4",
]
resnet50 = [
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
    "torch>=2.1",
    "torchvision>=0.16",
]
dev = [
    "pytest>=8",
    "numpy>=1.26,<3",
    "Pillow>=10.0,<12",
]

[tool.setuptools.packages.find]
where = ["src"]
